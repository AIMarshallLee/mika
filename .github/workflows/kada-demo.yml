# 咔哒(昆仑增长):咔哒手机版演示包的云端构建。
# 推送到 kada/** 分支时运行:
#   1. 构建咔哒演示包(assembleKada),同时构建原版 debug 包,确认原版构建没被白标改动影响;
#   2. 跑原版 core / app 单元测试;
#   3. 安装包作为构建产物(artifact)保存 14 天;
#   4. 只有提交说明里带 [publish-demo] 时,才把安装包放到本仓库的「预发布」(prerelease)供手机直接下载;
#   5. 只有提交说明里带 [publish-customer](或手动运行)时,构建「客户版」:同一个包改用私有发布密钥签名,
#      连同 GPL/LGPL 组件的对应源码包一起放到预发布 kada-v0.1.0-customer。
# 签名:内部测试机装的演示包用仓库里的调试密钥(app/debug.keystore,公开的,只给内部测试机);
# 交给客户的包只用私有发布密钥签名,密钥只在 GitHub Secrets(KADA_RELEASE_*)和老板 Mac 上的备份里,绝不进仓库。
name: Kada demo build

on:
  push:
    branches: ["kada/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kada-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (咔哒 + 原版)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # 咔哒(昆仑增长)修改:两个包分两次构建,并给 Gradle / Kotlin 编译更多内存。
      # 原因:同一次构建里编译两套 Kotlin,默认 2G 内存不够,Kotlin 编译报 OutOfMemoryError(GC overhead limit exceeded)。
      # 构建机有 16G 内存;只在云端构建时加大,不改仓库里的 gradle.properties(本机构建照旧)。
      - name: Build 咔哒 demo and original debug
        env:
          GRADLE_MEM: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          ./gradlew "$GRADLE_MEM" -Pkotlin.daemon.jvmargs=-Xmx4g :app:assembleKada --stacktrace
          ./gradlew "$GRADLE_MEM" -Pkotlin.daemon.jvmargs=-Xmx4g :app:assembleDebug --stacktrace
      - name: Inspect package
        id: apk
        run: |
          set -euo pipefail
          VERSION=0.1.0-demo
          mkdir -p dist
          OUT="dist/咔哒手机版-v${VERSION}.apk"
          cp app/build/outputs/apk/kada/app-kada.apk "$OUT"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump badging "$OUT" | grep -E "^package:|^application-label|^application-label-zh:|^launchable-activity|sdkVersion" | tee dist/badging.txt
          grep -q "package: name='com.kunlungrowth.kadadesk'" dist/badging.txt
          grep -q "versionName='${VERSION}'" dist/badging.txt
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:" | tee -a dist/badging.txt
          grep -q "package: name='com.wangzan101.mika'" dist/badging.txt
          # GitHub 会改写发布附件里的中文文件名,另存一份英文名的同一个包供下载链接使用
          cp "$OUT" "dist/kada-mobile-v${VERSION}.apk"
          ( cd dist && sha256sum "咔哒手机版-v${VERSION}.apk" "kada-mobile-v${VERSION}.apk" | tee SHA256SUMS.txt )
          ls -la dist
          echo "file=dist/kada-mobile-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: kada-mobile-demo
          path: dist/
          retention-days: 14
      - name: Publish prerelease (only with [publish-demo])
        if: contains(github.event.head_commit.message, '[publish-demo]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=kada-v0.1.0-demo
          NOTES="咔哒手机版 v0.1.0 演示版(Demo)。基于开源项目 Mika(Apache-2.0)二次开发,调试签名,仅供演示,不是正式商业版本。提交 ${GITHUB_SHA::7}。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.file }}" dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "${{ steps.apk.outputs.file }}" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease --title "咔哒手机版 v0.1.0 演示版" --notes "$NOTES"
          fi

  tests:
    name: unit tests (原版 core + app)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kada-test-results
          path: |
            core/build/reports/tests/test
            app/build/reports/tests/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore

  # 咔哒(昆仑增长)修改:客户版。和演示包是同一份代码,只换成私有发布密钥签名,并附上 GPL/LGPL 组件的对应源码包。
  customer:
    name: customer build (私有签名 + 开源源码包)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-customer]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build 咔哒
        env:
          GRADLE_MEM: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: ./gradlew "$GRADLE_MEM" -Pkotlin.daemon.jvmargs=-Xmx4g :app:assembleKada --stacktrace
      - name: Sign with the private release key
        env:
          KS_B64: ${{ secrets.KADA_RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KADA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KADA_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KADA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do [ -n "${!v}" ] || { echo "缺少发布密钥 Secret: $v"; exit 1; }; done
          VERSION=0.1.0-demo
          BT="$ANDROID_HOME/build-tools/35.0.0"
          KS="$RUNNER_TEMP/kada-release.p12"
          echo "$KS_B64" | base64 -d > "$KS"
          mkdir -p dist
          OUT="dist/kada-mobile-v${VERSION}-customer.apk"
          # apksigner 会替换掉构建时的调试签名(v1/v2/v3 一起换)
          "$BT/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "$OUT" app/build/outputs/apk/kada/app-kada.apk
          rm -f "$KS"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee dist/signature.txt
          # 不能是仓库里公开的调试密钥
          DEBUG_SHA=$(keytool -list -v -keystore app/debug.keystore -storepass android 2>/dev/null | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          NEW_SHA=$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' dist/signature.txt | head -1)
          echo "release cert sha256=$NEW_SHA debug cert sha256=$DEBUG_SHA"
          [ -n "$NEW_SHA" ] && [ "$NEW_SHA" != "$DEBUG_SHA" ]
          "$BT/aapt2" dump badging "$OUT" | grep -E "^package:" | tee -a dist/signature.txt
      - name: GPL/LGPL source pack
        run: |
          set -euo pipefail
          VERSION=0.1.0-demo
          NAME=kada-$VERSION-gpl-sources
          OUT=build/gpl-sources/$NAME
          rm -rf "$OUT" && mkdir -p "$OUT"
          while read -r name version url sum; do
            case "$name" in ''|'#'*) continue ;; esac
            curl -fsSL --retry 3 "$url" -o "$OUT/$name-$version.tar.gz"
            echo "$sum  $OUT/$name-$version.tar.gz" | sha256sum -c -
          done < tools/sandbox/sources.lock
          cp -R tools/sandbox/patches tools/sandbox/sources.lock tools/sandbox/build-native.sh tools/sandbox/README.md "$OUT/"
          cp licenses/GPL-2.0.txt licenses/GPL-3.0.txt licenses/LGPL-3.0.txt "$OUT/"
          python3 tools/sandbox/runtime-sources.py "$OUT/runtime"
          cp tools/sandbox/build-runtime.py tools/sandbox/runtime-sources.py app/src/main/assets/runtime/packages.json "$OUT/runtime/"
          cp -R tools/sandbox/runtime "$OUT/runtime/lock"
          printf '%s\n' "咔哒手机版 $VERSION 随安装包分发的 GPL/LGPL/MPL 组件的对应源码。" \
            "构建方法见 README.md(与上游 Mika 相同);咔哒没有修改这些组件。源码仓库:https://github.com/AIMarshallLee/mika" > "$OUT/README-kada.txt"
          tar -czf "dist/$NAME.tar.gz" -C build/gpl-sources "$NAME"
          tar -tzf "dist/$NAME.tar.gz" | grep -E "proot-|talloc-|runtime/SOURCES.txt" | head
          ( cd dist && sha256sum *.apk *.tar.gz | tee SHA256SUMS.txt )
          ls -la dist
      - name: Publish customer prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=kada-v0.1.0-customer
          NOTES="咔哒手机版 v0.1.0 客户版:私有发布密钥签名,和演示包是同一份代码(提交 ${GITHUB_SHA::7})。基于开源项目 Mika(Apache-2.0)二次开发;GPL/LGPL 组件的对应源码见 kada-0.1.0-demo-gpl-sources.tar.gz。注意:和内部测试机上的演示包签名不同,不能直接覆盖安装。"
          FILES="dist/kada-mobile-v0.1.0-demo-customer.apk dist/kada-0.1.0-demo-gpl-sources.tar.gz dist/SHA256SUMS.txt dist/signature.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --prerelease --title "咔哒手机版 v0.1.0 客户版" --notes "$NOTES"
          fi
